# Included from beego.vn server block — OAuth/Firebase/Capacitor-safe (no strict script-src).
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Content-Security-Policy "default-src 'self' https: data: blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: blob: https:; font-src 'self' data: https:; connect-src 'self' https: wss: blob:; media-src 'self' https: blob: data:; frame-src 'self' https://accounts.google.com https://*.firebaseapp.com https://*.google.com; form-action 'self' https:; base-uri 'self'; frame-ancestors 'self';" always;
